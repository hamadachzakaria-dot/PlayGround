<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayGround — Static Preview</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
    }
    main {
      max-width: 720px;
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
    }
    h1 { margin: 0 0 12px; font-size: 2rem; }
    p { margin: 0 0 16px; line-height: 1.6; color: #cbd5e1; }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      margin-bottom: 16px;
    }
    button {
      font-size: 1rem;
      padding: 10px 18px;
      border-radius: 10px;
      border: 0;
      background: #38bdf8;
      color: #082f49;
      font-weight: 700;
      cursor: pointer;
    }
    #status { margin-top: 16px; font-weight: 600; color: #86efac; }
  </style>
</head>
<body>
  <main>
    <span class="badge">LIVE PREVIEW READY</span>
    <h1>PlayGround Static App</h1>
    <p>This is a minimal static deployment used to validate startup and screenshot capture. If you can read this text on desktop and mobile captures, rendering works.</p>
    <button id="start-btn" type="button">Start</button>
    <div id="status" aria-live="polite">Ready to start.</div>
  </main>
  <script>
    document.getElementById('start-btn').addEventListener('click', function () {
      document.getElementById('status').textContent = 'Started at ' + new Date().toLocaleTimeString();
    });
  </script>
</body>
</html>
